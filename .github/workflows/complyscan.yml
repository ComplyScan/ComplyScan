name: ComplyScan self-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  self-scan:
    # Dogfood the CLI and SARIF integration on every change. This is a
    # regression check and evidence input, not a compliance certification.
    name: Scan ComplyScan with itself
    runs-on: ubuntu-latest
    steps:
      - name: Check out ComplyScan
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run the repository's ComplyScan action
        uses: ./
        with:
          severity: medium
          # Fork pull requests receive a read-only token. They still get the
          # deterministic scan and job summary, but cannot upload SARIF.
          upload-results: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
