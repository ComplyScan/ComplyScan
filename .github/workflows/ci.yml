name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Test
        run: go test ./...
      - name: Technical evidence benchmarks
        run: |
          ./scripts/evaluate-technical-evidence.sh
          ./scripts/evaluate-technical-evidence.sh --manifest testdata/technical-evaluation/nist-manifest.json
      - name: Vet
        run: go vet ./...
      - name: Validate installer syntax
        run: |
          sh -n install.sh
          sh -n scripts/evaluate-technical-evidence.sh
          sh -n scripts/validate-profile-draft.sh
          sh -n scripts/validate-ollama.sh
