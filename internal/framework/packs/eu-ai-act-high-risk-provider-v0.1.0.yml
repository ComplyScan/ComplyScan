schema-version: 1
id: eu-ai-act-high-risk-provider
name: EU AI Act high-risk system requirements for providers
version: 0.1.0
released: "2026-08-02"
source:
  title: Artificial Intelligence Act
  reference: Regulation (EU) 2024/1689
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1689
  edition: Official Journal text dated 13 June 2024
coverage:
  framework: eu-ai-act
  roles: [provider]
  risk-classification: high-risk
  provisions: [Article 9, Article 10, Article 11 and Annex IV, Article 12, Article 13, Article 14, Article 15]
  limitations:
    - This is not a complete EU AI Act implementation and does not cover every provider, deployer, importer, distributor, product-manufacturer, transparency, GPAI, prohibited-practice, conformity, registration, monitoring, or enforcement obligation.
    - Repository evidence cannot prove operational effectiveness, legal applicability, or conformity; every candidate requires semantic and human verification.
controls:
  - id: eu-aia-9-risk-management
    title: Lifecycle risk management system
    source-reference: Article 9
    objective: Maintain a documented and iterative process for identifying, evaluating, treating, testing, and reviewing risks throughout the high-risk AI system lifecycle.
    evidence:
      - id: documented-risk-process
        description: Documented AI risk-management or risk-assessment process with owned mitigations or controls.
        file-kinds: [risk-assessment, ai-governance, documentation]
        path-keywords: [risk]
        keyword-groups:
          - [risk management, risk assessment, risk register]
          - [mitigation, treatment, control]
        verification: semantic-and-human
      - id: intended-use-and-misuse
        description: Analysis of intended use, reasonably foreseeable misuse, affected people, and fundamental-rights or safety impacts.
        file-kinds: [risk-assessment, ai-governance, documentation]
        keyword-groups:
          - [intended purpose, intended use]
          - [foreseeable misuse, misuse]
          - [fundamental rights, health, safety, affected groups]
        verification: semantic-and-human
      - id: testing-monitoring-feedback
        description: Evidence linking risk testing and residual-risk review to monitoring or post-market feedback.
        file-kinds: [risk-assessment, ai-governance, documentation, configuration, ci]
        keyword-groups:
          - [testing, evaluation, validation]
          - [monitoring, post-market, feedback]
        verification: semantic-and-human
  - id: eu-aia-10-data-governance
    title: Data and data governance
    source-reference: Article 10
    objective: Apply intended-purpose-appropriate governance and quality practices to training, validation, and testing data when those data sets are used.
    applicability-note: Detailed Article 10 data-set duties depend on whether the system trains models using data; that fact is not yet captured by the system profile.
    evidence:
      - id: data-governance-process
        description: Documented governance for data origin, collection, preparation, labelling, curation, and intended purpose.
        file-kinds: [ai-governance, documentation, risk-assessment, configuration]
        path-keywords: [data, dataset]
        keyword-groups:
          - [data governance, dataset governance, data management]
          - [provenance, origin, collection, preparation, labelling, labeling, curation]
        verification: semantic-and-human
      - id: data-quality-and-representativeness
        description: Evidence assessing relevance, representativeness, completeness, errors, and statistical properties.
        file-kinds: [ai-governance, documentation, risk-assessment]
        keyword-groups:
          - [representative, representativeness]
          - [complete, completeness, missing data]
          - [error, quality, statistical]
        verification: semantic-and-human
      - id: bias-and-data-protection
        description: Bias analysis and mitigation with appropriate handling of personal or special-category data.
        file-kinds: [ai-governance, documentation, risk-assessment, privacy-documentation]
        keyword-groups:
          - [bias, discrimination, fairness]
          - [personal data, sensitive data, special category, privacy]
        verification: semantic-and-human
  - id: eu-aia-11-technical-documentation
    title: Technical documentation
    source-reference: Article 11 and Annex IV
    objective: Maintain current technical documentation that describes the system, development, operation, evaluation, risk controls, changes, and conformity evidence.
    evidence:
      - id: system-description-and-versions
        description: System identity, provider, intended purpose, versions, deployment forms, and relevant software or hardware.
        file-kinds: [ai-governance, model-card, documentation, readme]
        path-keywords: [ai-system, model-card, technical]
        keyword-groups:
          - [intended purpose, intended use]
          - [version, release]
          - [provider, owner]
        verification: semantic-and-human
      - id: architecture-and-interactions
        description: Architecture, components, dependencies, external-system interactions, data flows, and deployment environment.
        file-kinds: [ai-governance, model-card, documentation, configuration]
        keyword-groups:
          - [architecture, component, dependency]
          - [interaction, integration, data flow, deployment]
        verification: semantic-and-human
      - id: evaluation-risk-and-change-record
        description: Evaluation metrics and limitations linked to risk controls, standards, and material change history.
        file-kinds: [ai-governance, model-card, documentation, risk-assessment]
        keyword-groups:
          - [evaluation, metric, benchmark, limitation]
          - [risk, control, mitigation]
          - [change, revision, version history, changelog]
        verification: semantic-and-human
  - id: eu-aia-12-record-keeping
    title: Automatic record-keeping
    source-reference: Article 12
    objective: Design logging capabilities that support traceability, risk identification, post-market monitoring, and appropriate operational oversight.
    evidence:
      - id: automatic-event-logging
        description: Technical design or implementation for automatic event logging and traceability across the system lifetime.
        file-kinds: [ai-governance, documentation, source, configuration]
        path-keywords: [log, audit, telemetry]
        keyword-groups:
          - [event log, audit log, logging, traceability]
          - [automatic, generated, event]
        verification: technical-semantic-and-human
      - id: log-access-retention-and-interpretation
        description: Defined access, retention, protection, collection, storage, and interpretation practices for logs.
        file-kinds: [ai-governance, documentation, privacy-documentation, configuration]
        keyword-groups:
          - [log, audit trail]
          - [retention, storage]
          - [access, protection, interpret]
        verification: semantic-and-human
      - id: monitoring-linkage
        description: Logging is connected to operational or post-market monitoring and incident investigation.
        file-kinds: [ai-governance, documentation, risk-assessment, ci]
        keyword-groups:
          - [log, audit trail]
          - [monitoring, incident, post-market]
        verification: semantic-and-human
  - id: eu-aia-13-deployer-information
    title: Transparency and information for deployers
    source-reference: Article 13
    objective: Provide deployers with clear instructions covering provider identity, system capabilities and limits, oversight, resources, maintenance, inputs, outputs, and logging.
    evidence:
      - id: instructions-capabilities-limitations
        description: Deployable instructions explaining intended purpose, capabilities, limitations, accuracy, foreseeable misuse, and output interpretation.
        file-kinds: [ai-governance, model-card, documentation, readme]
        path-keywords: [instructions, user-guide, model-card]
        keyword-groups:
          - [capability, capabilities, intended purpose]
          - [limitation, limitations, constraint]
          - [accuracy, performance, metric]
        verification: semantic-and-human
      - id: provider-resources-and-maintenance
        description: Provider contact information plus required hardware, compute, lifetime, maintenance, and update expectations.
        file-kinds: [ai-governance, documentation, readme]
        keyword-groups:
          - [provider, contact, owner]
          - [hardware, compute, resource]
          - [maintenance, update, lifetime]
        verification: semantic-and-human
      - id: oversight-input-output-and-logs
        description: Instructions for human oversight, relevant input specifications, output interpretation, and log collection.
        file-kinds: [ai-governance, model-card, documentation, readme]
        keyword-groups:
          - [human oversight, human review]
          - [input, input data]
          - [output, interpretation]
          - [log, logging]
        verification: semantic-and-human
  - id: eu-aia-14-human-oversight
    title: Human oversight
    source-reference: Article 14
    objective: Provide proportionate technical and organisational measures that enable competent people to understand, monitor, interpret, override, or stop the system.
    evidence:
      - id: oversight-roles-and-competence
        description: Named oversight roles with competence, training, authority, and an understood intervention process.
        file-kinds: [ai-governance, documentation, risk-assessment]
        path-keywords: [oversight, roles, responsibility]
        keyword-groups:
          - [human oversight, human review]
          - [competence, training, authority, responsibility]
        verification: semantic-and-human
      - id: interpretation-intervention-and-stop
        description: Measures enabling reviewers to understand limits, interpret outputs, disregard or override results, intervene, and safely stop operation.
        file-kinds: [ai-governance, documentation, risk-assessment, source]
        keyword-groups:
          - [interpret, understand, limitation]
          - [override, disregard, intervene]
          - [stop, interrupt, fail-safe, shutdown]
        verification: technical-semantic-and-human
      - id: automation-bias-and-residual-risk
        description: Controls for automation bias and residual health, safety, or fundamental-rights risks during use and foreseeable misuse.
        file-kinds: [ai-governance, documentation, risk-assessment]
        keyword-groups:
          - [automation bias, over-reliance, overreliance]
          - [residual risk, fundamental rights, health, safety]
        verification: semantic-and-human
  - id: eu-aia-15-accuracy-robustness-cybersecurity
    title: Accuracy, robustness, and cybersecurity
    source-reference: Article 15
    objective: Define, measure, communicate, and maintain appropriate accuracy, robustness, resilience, and cybersecurity throughout the system lifecycle.
    evidence:
      - id: accuracy-and-performance
        description: Declared accuracy and performance metrics supported by testing, benchmarks, thresholds, and limitations.
        file-kinds: [model-card, ai-governance, documentation, risk-assessment, ci]
        path-keywords: [evaluation, benchmark, performance, test]
        keyword-groups:
          - [accuracy, performance, metric]
          - [test, evaluation, benchmark]
          - [threshold, limitation, acceptance criteria]
        verification: technical-semantic-and-human
      - id: robustness-and-fail-safe-behaviour
        description: Resilience testing and controls for errors, faults, inconsistencies, feedback loops, backup, and fail-safe behaviour.
        file-kinds: [ai-governance, documentation, risk-assessment, source, ci]
        keyword-groups:
          - [robustness, resilience]
          - [error, fault, inconsistency, feedback loop]
          - [fail-safe, fallback, backup, recovery]
        verification: technical-semantic-and-human
      - id: ai-cybersecurity
        description: Risk-appropriate controls for AI-specific threats such as poisoned data or models, adversarial inputs, confidentiality attacks, and model flaws.
        file-kinds: [ai-governance, documentation, risk-assessment, source, configuration, ci]
        path-keywords: [security, threat, adversarial]
        keyword-groups:
          - [cybersecurity, security, threat model]
          - [data poisoning, model poisoning, adversarial, model evasion, confidentiality attack, model flaw]
        verification: technical-semantic-and-human
