version: 1

scan:
  exclude:
    - node_modules
    - vendor
    - dist
    - build
    - testdata
    - .complyscan/reports
  max-files: 25000
  max-total-bytes: 104857600
  include-nested-repositories: false
  tracked-only: false

fail-on: high

rules:
  AI-DISC-001:
    enabled: true
  AI-LOG-001:
    enabled: true
  AI-SEC-001:
    enabled: true
  AI-DOC-001:
    enabled: true
  AI-RISK-001:
    enabled: true

ai:
  provider: none
  ollama:
    endpoint: http://127.0.0.1:11434
    model: gemma3
    timeout-seconds: 120
    max-findings: 20

systems:
  - id: complyscan-cli
    name: ComplyScan
    intended-purpose: Identify repository evidence and technical signals that require AI compliance engineering review.
    lifecycle-stage: development
    organization-roles: [unknown]
    operating-regions: [global]
    use-case-domains: [software-development]
    users: [software developers, compliance engineering teams]
    affected-groups: [developers and repository owners whose systems are assessed]
    decision-impact: advisory
    human-oversight: required
    data:
      personal-data: unknown
      special-category-data: unknown
      children-data: unknown
    deployment-models: [open-source, local-cli]
    profile-review:
      status: draft
    applicability:
      - framework: eu-ai-act
        status: needs-review

baseline: .complyscan-baseline.json

suppressions:
  - rule: AI-LOG-001
    path: internal/rules/logging_test.go
    reason: Unit tests intentionally contain logging examples to verify detection.
  - rule: AI-SEC-001
    path: internal/rules/secrets_test.go
    reason: Unit tests contain unmistakably synthetic credentials to verify redaction.
