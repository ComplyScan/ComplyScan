version: 2

project_name: complyscan

builds:
  - id: complyscan
    main: ./cmd/complyscan
    binary: complyscan
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.buildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - ids:
      - complyscan
    name_template: "complyscan_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  name_template: "ComplyScan {{ .Tag }}"
  extra_files:
    - glob: ./install.sh

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
