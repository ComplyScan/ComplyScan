name: ComplyScan
description: Discover AI implementations and code-level governance safeguards, then optionally upload SARIF results.
author: ComplyScan contributors

branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Repository-relative path to scan.
    required: false
    default: .
  config:
    description: Optional repository-relative path to a ComplyScan configuration file.
    required: false
    default: ""
  severity:
    description: Minimum severity included in SARIF output.
    required: false
    default: info
  sarif-file:
    description: Repository-relative path for the generated SARIF file.
    required: false
    default: complyscan.sarif
  category:
    description: GitHub code-scanning category for this analysis.
    required: false
    default: complyscan
  upload-results:
    description: Upload the SARIF file to GitHub code scanning.
    required: false
    default: "true"
  fail-on-findings:
    description: Fail the action when a finding meets the configured fail-on threshold.
    required: false
    default: "true"
  changed-since:
    description: Optional Git reference used to limit code findings to changed files and explicit AI review context to changed eligible files plus bounded connected files; requires the reference to be available in the checkout.
    required: false
    default: ""
  review:
    description: Explicit AI review provider; empty or none runs a deterministic scan, configured uses repository configuration, and a provider name overrides it.
    required: false
    default: ""
  require-ai-review:
    description: Return exit code 2 if an explicitly requested AI review is incomplete.
    required: false
    default: "false"
  ollama-model:
    description: Optional Ollama model override.
    required: false
    default: ""
  ollama-endpoint:
    description: Optional loopback Ollama base URL override.
    required: false
    default: ""
  model:
    description: Optional remote-provider model override.
    required: false
    default: ""
  api-key-env:
    description: Optional environment-variable name containing the remote-provider API key; never pass the key value here.
    required: false
    default: ""
  provider-name:
    description: Optional display name for a custom OpenAI-compatible provider.
    required: false
    default: ""
  base-url:
    description: Optional HTTPS API base URL for an OpenAI-compatible provider; prefer repository configuration.
    required: false
    default: ""

outputs:
  exit-code:
    description: ComplyScan exit code (0 for clear, 1 for threshold findings, 2 for an operational/configuration error or incomplete required AI review).
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: Absolute path to the generated SARIF file.
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - name: Run ComplyScan
      id: scan
      shell: bash
      env:
        INPUT_CHANGED_SINCE: ${{ inputs.changed-since }}
        INPUT_API_KEY_ENV: ${{ inputs.api-key-env }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_OLLAMA_ENDPOINT: ${{ inputs.ollama-endpoint }}
        INPUT_OLLAMA_MODEL: ${{ inputs.ollama-model }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PROVIDER_NAME: ${{ inputs.provider-name }}
        INPUT_REVIEW: ${{ inputs.review }}
        INPUT_REQUIRE_AI_REVIEW: ${{ inputs.require-ai-review }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_SEVERITY: ${{ inputs.severity }}
      run: |
        target="$INPUT_PATH"
        if [[ "$target" != /* ]]; then
          target="$GITHUB_WORKSPACE/$target"
        fi

        sarif_file="$INPUT_SARIF_FILE"
        if [[ "$sarif_file" != /* ]]; then
          sarif_file="$GITHUB_WORKSPACE/$sarif_file"
        fi
        mkdir -p "$(dirname "$sarif_file")"

        binary="$RUNNER_TEMP/complyscan-action"
        go -C "$GITHUB_ACTION_PATH" build -o "$binary" ./cmd/complyscan

        command_name=scan
        review_value=$(printf '%s' "$INPUT_REVIEW" | tr '[:upper:]' '[:lower:]')
        if [[ -n "$review_value" && "$review_value" != "none" ]]; then
          command_name=review
        fi
        if [[ "$command_name" == "scan" && ( -n "$INPUT_MODEL" || -n "$INPUT_API_KEY_ENV" || -n "$INPUT_PROVIDER_NAME" || -n "$INPUT_BASE_URL" || -n "$INPUT_OLLAMA_MODEL" || -n "$INPUT_OLLAMA_ENDPOINT" || "$INPUT_REQUIRE_AI_REVIEW" == "true" ) ]]; then
          echo "AI-specific Action inputs require review: configured or an explicit review provider." >&2
          exit 2
        fi

        arguments=("$command_name" "$target" --format sarif --severity "$INPUT_SEVERITY")
        if [[ -n "$INPUT_CHANGED_SINCE" ]]; then
          arguments+=(--changed-since "$INPUT_CHANGED_SINCE")
        fi
        if [[ "$command_name" == "review" && "$review_value" != "configured" ]]; then
          arguments+=(--provider "$INPUT_REVIEW")
        fi
        if [[ "$command_name" == "review" && "$INPUT_REQUIRE_AI_REVIEW" == "true" ]]; then
          arguments+=(--require-ai-review)
        fi
        if [[ -n "$INPUT_OLLAMA_MODEL" ]]; then
          arguments+=(--ollama-model "$INPUT_OLLAMA_MODEL")
        fi
        if [[ -n "$INPUT_OLLAMA_ENDPOINT" ]]; then
          arguments+=(--ollama-endpoint "$INPUT_OLLAMA_ENDPOINT")
        fi
        if [[ -n "$INPUT_MODEL" ]]; then
          arguments+=(--model "$INPUT_MODEL")
        fi
        if [[ -n "$INPUT_API_KEY_ENV" ]]; then
          arguments+=(--api-key-env "$INPUT_API_KEY_ENV")
        fi
        if [[ -n "$INPUT_PROVIDER_NAME" ]]; then
          arguments+=(--provider-name "$INPUT_PROVIDER_NAME")
        fi
        if [[ -n "$INPUT_BASE_URL" ]]; then
          arguments+=(--base-url "$INPUT_BASE_URL")
        fi
        if [[ -n "$INPUT_CONFIG" ]]; then
          config="$INPUT_CONFIG"
          if [[ "$config" != /* ]]; then
            config="$GITHUB_WORKSPACE/$config"
          fi
          arguments+=(--config "$config")
        fi

        set +e
        "$binary" "${arguments[@]}" > "$sarif_file"
        status=$?
        set -e

        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$sarif_file" >> "$GITHUB_OUTPUT"
        if [[ -s "$sarif_file" ]]; then
          echo "sarif-ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "sarif-ready=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-results == 'true' && steps.scan.outputs.sarif-ready == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: ${{ inputs.category }}

    - name: Enforce scan completion
      if: ${{ always() && steps.scan.outputs.exit-code != '' }}
      shell: bash
      env:
        COMPLYSCAN_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        if [[ "$COMPLYSCAN_EXIT_CODE" -gt 1 ]]; then
          exit "$COMPLYSCAN_EXIT_CODE"
        fi

    - name: Enforce finding threshold
      if: ${{ always() && inputs.fail-on-findings == 'true' && steps.scan.outputs.exit-code == '1' }}
      shell: bash
      run: exit 1
