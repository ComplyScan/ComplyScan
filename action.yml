name: ComplyScan
description: Run the configured compliance-aware repository scan and optionally upload SARIF results.
author: ComplyScan contributors

branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Repository-relative path to scan.
    required: false
    default: .
  config:
    description: Optional repository-relative path to a ComplyScan configuration file.
    required: false
    default: ""
  severity:
    description: Minimum severity included in SARIF output.
    required: false
    default: info
  sarif-file:
    description: Repository-relative path for the generated SARIF file.
    required: false
    default: complyscan.sarif
  category:
    description: GitHub code-scanning category for this analysis.
    required: false
    default: complyscan
  upload-results:
    description: Upload the SARIF file to GitHub code scanning.
    required: false
    default: "true"
  publish-summary:
    description: Append the latest concise Markdown report to the GitHub job summary. Set false to keep the report out of the summary; raw JSON is never uploaded automatically.
    required: false
    default: "true"
  fail-on-findings:
    description: Fail the action when a finding meets the configured fail-on threshold.
    required: false
    default: "true"
  scope:
    description: Scan scope. auto change-scopes file-local findings and model context on pull_request events while repository-wide governance gates still run; it requires the checked-out base commit and uses full scope on non-PR events. Change-scoped pull_request_target runs are refused; consciously use full only when a base-branch scan is intended.
    required: false
    default: auto
  changed-since:
    description: Optional explicit base Git reference for auto or pull-request scope. File-local findings and model context are change-scoped while repository-wide governance gates still run.
    required: false
    default: ""
  ai-review:
    description: AI review mode. none is the safe deterministic default. Any enabled mode first makes or reuses source-free finding-binding and repository-shaped compatibility checks; a live check normally uses two requests and may make up to four total for temporary provider failures. It may then send every structural candidate across multiple bounded requests plus synthesis, or a bounded representative manifest/runtime/configuration sample when no structural AI anchor is found; it can resend bounded evidence during transient or schema-validation recovery and run independent hosted source and same-level synthesis requests concurrently, with variable runtime and provider cost that concurrency may incur faster. Repository analysis is capped at 32 concurrent calls, 256 total provider requests, and finite retry waits; Ollama remains serial without portable capacity metadata, and permanent provider or schema failure may still leave AI review incomplete. configured explicitly trusts the provider destination and API-key environment name committed in repository configuration; otherwise use ollama, openai, anthropic, gemini, xai, groq, mistral, openrouter, or openai-compatible for a workflow-controlled one-run provider.
    required: false
    default: none
  review:
    description: Deprecated alias for ai-review. An empty legacy value follows the new safe none default; do not set both inputs.
    required: false
    default: ""
  require-ai-review:
    description: Policy-only gate that returns exit code 2 unless AI review completes. With ai-review none, the deterministic report is still produced before the gate fails.
    required: false
    default: "false"
  refresh-review:
    description: Ignore matching cached model results and request a fresh configured AI review.
    required: false
    default: "false"
  ollama-model:
    description: Optional one-run Ollama model override.
    required: false
    default: ""
  ollama-endpoint:
    description: Optional one-run loopback Ollama base URL override.
    required: false
    default: ""
  model:
    description: Optional one-run remote-provider model override.
    required: false
    default: ""
  api-key-env:
    description: Workflow-controlled environment-variable name containing a hosted-provider API key; never pass the credential value here. Required for hosted providers other than OpenAI, Anthropic, and Gemini.
    required: false
    default: ""
  provider-name:
    description: Workflow-controlled display name for a custom OpenAI-compatible provider; required with ai-review openai-compatible.
    required: false
    default: ""
  base-url:
    description: Workflow-controlled HTTPS API base URL for an OpenAI-compatible provider; required with ai-review openai-compatible.
    required: false
    default: ""

outputs:
  exit-code:
    description: ComplyScan exit code (0 for clear, 1 for threshold findings, 2 for an operational/configuration error or an incomplete requested AI review).
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: Absolute path to the generated SARIF file.
    value: ${{ steps.scan.outputs.sarif-file }}
  markdown-report:
    description: Absolute path to the latest concise Markdown report.
    value: ${{ steps.scan.outputs.markdown-report }}
  json-report:
    description: Absolute path to the latest JSON evidence bundle; the Action does not upload it automatically.
    value: ${{ steps.scan.outputs.json-report }}
  active-actions:
    description: Number of active developer actions in the generated evidence bundle.
    value: ${{ steps.scan.outputs.active-actions }}
  new-actions:
    description: Number of developer actions first observed by this scan.
    value: ${{ steps.scan.outputs.new-actions }}
  reopened-actions:
    description: Number of previously resolved developer actions observed again by this scan.
    value: ${{ steps.scan.outputs.reopened-actions }}
  resolved-actions:
    description: Number of baseline developer actions resolved by this scan.
    value: ${{ steps.scan.outputs.resolved-actions }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        # Go 1.24+ emits the LC_UUID load command required by macOS 26 dyld.
        # The Linux CI matrix separately verifies the module's Go 1.22 floor.
        go-version: 1.26.x
        cache: false

    - name: Run ComplyScan
      id: scan
      shell: bash
      env:
        COMPLYSCAN_EVENT_NAME: ${{ github.event_name }}
        COMPLYSCAN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        INPUT_AI_REVIEW: ${{ inputs.ai-review }}
        INPUT_CHANGED_SINCE: ${{ inputs.changed-since }}
        INPUT_API_KEY_ENV: ${{ inputs.api-key-env }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_OLLAMA_ENDPOINT: ${{ inputs.ollama-endpoint }}
        INPUT_OLLAMA_MODEL: ${{ inputs.ollama-model }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PROVIDER_NAME: ${{ inputs.provider-name }}
        INPUT_REFRESH_REVIEW: ${{ inputs.refresh-review }}
        INPUT_REVIEW: ${{ inputs.review }}
        INPUT_REQUIRE_AI_REVIEW: ${{ inputs.require-ai-review }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_SEVERITY: ${{ inputs.severity }}
      run: |
        target="$INPUT_PATH"
        if [[ "$target" != /* ]]; then
          target="$GITHUB_WORKSPACE/$target"
        fi

        sarif_file="$INPUT_SARIF_FILE"
        if [[ "$sarif_file" != /* ]]; then
          sarif_file="$GITHUB_WORKSPACE/$sarif_file"
        fi
        mkdir -p "$(dirname "$sarif_file")"

        binary="$RUNNER_TEMP/complyscan-action"
        go -C "$GITHUB_ACTION_PATH" build -o "$binary" ./cmd/complyscan

        scope_value=$(printf '%s' "$INPUT_SCOPE" | tr '[:upper:]' '[:lower:]')
        case "$scope_value" in
          auto|pull-request|full) ;;
          *)
            echo "Invalid scope '$INPUT_SCOPE' (want auto, pull-request, or full)." >&2
            exit 2
            ;;
        esac
        if [[ "$scope_value" == "full" && -n "$INPUT_CHANGED_SINCE" ]]; then
          echo "changed-since cannot be combined with scope: full." >&2
          exit 2
        fi
        if [[ "$COMPLYSCAN_EVENT_NAME" == "pull_request_target" && ( "$scope_value" == "auto" || "$scope_value" == "pull-request" || -n "$INPUT_CHANGED_SINCE" ) ]]; then
          echo "ComplyScan refuses change-scoped pull_request_target runs because its default checkout is the base branch and cannot assess PR changes safely. Use a pull_request workflow for change scanning, or consciously choose scope: full for a base-only scan." >&2
          exit 2
        fi

        changed_since="$INPUT_CHANGED_SINCE"
        derived_pr_base=false
        if [[ -z "$changed_since" && ( "$scope_value" == "pull-request" || ( "$scope_value" == "auto" && "$COMPLYSCAN_EVENT_NAME" == "pull_request" ) ) ]]; then
          changed_since="$COMPLYSCAN_PR_BASE_SHA"
          derived_pr_base=true
        fi
        if [[ "$derived_pr_base" == "true" && -z "$changed_since" ]]; then
          echo "ComplyScan could not determine this pull request's base SHA. Use actions/checkout with fetch-depth: 0, supply changed-since, or explicitly choose scope: full." >&2
          exit 2
        fi
        if [[ -n "$changed_since" ]] && ! git -C "$target" rev-parse --verify --quiet "${changed_since}^{commit}" >/dev/null; then
          echo "ComplyScan cannot access changed-since reference '$changed_since'. Use actions/checkout with fetch-depth: 0, supply an available reference, or explicitly choose scope: full." >&2
          exit 2
        fi
        if [[ "$scope_value" == "pull-request" && -z "$changed_since" ]]; then
          echo "scope: pull-request requires a GitHub pull-request base SHA or an explicit changed-since reference." >&2
          exit 2
        fi

        ai_review_value=$(printf '%s' "$INPUT_AI_REVIEW" | tr '[:upper:]' '[:lower:]')
        legacy_review_value=$(printf '%s' "$INPUT_REVIEW" | tr '[:upper:]' '[:lower:]')
        if [[ -n "$legacy_review_value" ]]; then
          if [[ "$ai_review_value" != "none" ]]; then
            echo "ai-review and its deprecated review alias cannot both be set." >&2
            exit 2
          fi
          ai_review_value="$legacy_review_value"
        fi
        case "$ai_review_value" in
          none|configured|ollama|openai|anthropic|gemini|xai|groq|mistral|openrouter|openai-compatible) ;;
          *)
            echo "Invalid ai-review '$ai_review_value' (want none, configured, ollama, openai, anthropic, gemini, xai, groq, mistral, openrouter, or openai-compatible)." >&2
            exit 2
            ;;
        esac

        effective_api_key_env="$INPUT_API_KEY_ENV"
        effective_base_url="$INPUT_BASE_URL"
        effective_provider_name="$INPUT_PROVIDER_NAME"
        case "$ai_review_value" in
          none)
            if [[ -n "$INPUT_MODEL" || -n "$INPUT_API_KEY_ENV" || -n "$INPUT_PROVIDER_NAME" || -n "$INPUT_BASE_URL" || -n "$INPUT_OLLAMA_MODEL" || -n "$INPUT_OLLAMA_ENDPOINT" || "$INPUT_REFRESH_REVIEW" == "true" ]]; then
              echo "ai-review: none cannot be combined with provider, model, endpoint, credential-routing, or refresh inputs." >&2
              exit 2
            fi
            ;;
          openai)
            if [[ -z "$effective_api_key_env" ]]; then
              effective_api_key_env=OPENAI_API_KEY
            fi
            ;;
          anthropic)
            if [[ -z "$effective_api_key_env" ]]; then
              effective_api_key_env=ANTHROPIC_API_KEY
            fi
            ;;
          gemini)
            if [[ -z "$effective_api_key_env" ]]; then
              effective_api_key_env=GEMINI_API_KEY
            fi
            ;;
          xai|groq|mistral|openrouter)
            if [[ -z "$effective_api_key_env" ]]; then
              echo "ai-review: $ai_review_value requires workflow input api-key-env so repository configuration cannot choose a credential." >&2
              exit 2
            fi
            case "$ai_review_value" in
              xai)
                [[ -n "$effective_base_url" ]] || effective_base_url=https://api.x.ai/v1
                [[ -n "$effective_provider_name" ]] || effective_provider_name=xAI
                ;;
              groq)
                [[ -n "$effective_base_url" ]] || effective_base_url=https://api.groq.com/openai/v1
                [[ -n "$effective_provider_name" ]] || effective_provider_name=Groq
                ;;
              mistral)
                [[ -n "$effective_base_url" ]] || effective_base_url=https://api.mistral.ai/v1
                [[ -n "$effective_provider_name" ]] || effective_provider_name=Mistral
                ;;
              openrouter)
                [[ -n "$effective_base_url" ]] || effective_base_url=https://openrouter.ai/api/v1
                [[ -n "$effective_provider_name" ]] || effective_provider_name=OpenRouter
                ;;
            esac
            ;;
          openai-compatible)
            if [[ -z "$INPUT_API_KEY_ENV" || -z "$INPUT_BASE_URL" || -z "$INPUT_PROVIDER_NAME" ]]; then
              echo "ai-review: openai-compatible requires workflow inputs api-key-env, base-url, and provider-name so repository configuration cannot choose a credential destination." >&2
              exit 2
            fi
            ;;
        esac

        arguments=(scan "$target" --format sarif --severity "$INPUT_SEVERITY")
        if [[ -n "$changed_since" ]]; then
          arguments+=(--changed-since "$changed_since")
        fi
        if [[ "$ai_review_value" == "none" ]]; then
          arguments+=(--deterministic-only)
        elif [[ "$ai_review_value" == "configured" ]]; then
          arguments+=(--deep)
        else
          arguments+=(--provider "$ai_review_value")
        fi
        if [[ "$INPUT_REQUIRE_AI_REVIEW" == "true" ]]; then
          arguments+=(--require-ai-review)
        fi
        if [[ "$INPUT_REFRESH_REVIEW" == "true" ]]; then
          arguments+=(--refresh-review)
        fi
        if [[ -n "$INPUT_OLLAMA_MODEL" ]]; then
          arguments+=(--ollama-model "$INPUT_OLLAMA_MODEL")
        fi
        if [[ -n "$INPUT_OLLAMA_ENDPOINT" ]]; then
          arguments+=(--ollama-endpoint "$INPUT_OLLAMA_ENDPOINT")
        fi
        if [[ -n "$INPUT_MODEL" ]]; then
          arguments+=(--model "$INPUT_MODEL")
        fi
        if [[ -n "$effective_api_key_env" ]]; then
          arguments+=(--api-key-env "$effective_api_key_env")
        fi
        if [[ -n "$effective_provider_name" ]]; then
          arguments+=(--provider-name "$effective_provider_name")
        fi
        if [[ -n "$effective_base_url" ]]; then
          arguments+=(--base-url "$effective_base_url")
        fi
        if [[ -n "$INPUT_CONFIG" ]]; then
          config="$INPUT_CONFIG"
          if [[ "$config" != /* ]]; then
            config="$GITHUB_WORKSPACE/$config"
          fi
          arguments+=(--config "$config")
        fi

        if [[ "$COMPLYSCAN_EVENT_NAME" == "pull_request" && -n "$changed_since" ]]; then
          base_checkout="$RUNNER_TEMP/complyscan-action-base"
          base_archive="$RUNNER_TEMP/complyscan-action-base.tar"
          base_report="$RUNNER_TEMP/complyscan-action-base.json"
          mkdir -p "$base_checkout"
          git -C "$target" archive --format=tar --output="$base_archive" "$changed_since"
          tar -xf "$base_archive" -C "$base_checkout"
          target_prefix=$(git -C "$target" rev-parse --show-prefix)
          base_target="$base_checkout"
          if [[ -n "$target_prefix" ]]; then
            base_target="$base_checkout/${target_prefix%/}"
          fi
          base_arguments=(scan "$base_target" --format json --deterministic-only --no-report)
          if [[ -n "$INPUT_CONFIG" ]]; then
            base_arguments+=(--config "$config")
          fi
          set +e
          "$binary" "${base_arguments[@]}" > "$base_report"
          base_status=$?
          set -e
          if [[ "$base_status" -gt 1 ]]; then
            echo "ComplyScan could not create the deterministic base action comparison." >&2
            exit "$base_status"
          fi
          arguments+=(--action-baseline "$base_report")
        fi

        markdown_report="$target/.complyscan/reports/latest.md"
        json_report="$target/.complyscan/reports/latest.json"
        report_start_marker="$RUNNER_TEMP/complyscan-report-start"
        touch "$report_start_marker"

        set +e
        "$binary" "${arguments[@]}" > "$sarif_file"
        status=$?
        set -e

        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$sarif_file" >> "$GITHUB_OUTPUT"
        echo "markdown-report=$markdown_report" >> "$GITHUB_OUTPUT"
        echo "json-report=$json_report" >> "$GITHUB_OUTPUT"
        if [[ -s "$sarif_file" ]]; then
          echo "sarif-ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "sarif-ready=false" >> "$GITHUB_OUTPUT"
        fi
        if [[ -s "$markdown_report" && "$markdown_report" -nt "$report_start_marker" ]]; then
          echo "markdown-report-ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "markdown-report-ready=false" >> "$GITHUB_OUTPUT"
        fi
        if [[ -s "$json_report" && "$json_report" -nt "$report_start_marker" ]]; then
          echo "json-report-ready=true" >> "$GITHUB_OUTPUT"
          active_actions=$("$binary" actions list "$target" --status active --format count)
          new_actions=$("$binary" actions list "$target" --status new --format count)
          reopened_actions=$("$binary" actions list "$target" --status reopened --format count)
          resolved_actions=$("$binary" actions list "$target" --status resolved --format count)
          echo "active-actions=$active_actions" >> "$GITHUB_OUTPUT"
          echo "new-actions=$new_actions" >> "$GITHUB_OUTPUT"
          echo "reopened-actions=$reopened_actions" >> "$GITHUB_OUTPUT"
          echo "resolved-actions=$resolved_actions" >> "$GITHUB_OUTPUT"
        else
          echo "json-report-ready=false" >> "$GITHUB_OUTPUT"
          echo "active-actions=0" >> "$GITHUB_OUTPUT"
          echo "new-actions=0" >> "$GITHUB_OUTPUT"
          echo "reopened-actions=0" >> "$GITHUB_OUTPUT"
          echo "resolved-actions=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish concise report summary
      if: ${{ always() && inputs.publish-summary == 'true' && steps.scan.outputs.markdown-report-ready == 'true' }}
      shell: bash
      env:
        COMPLYSCAN_EVENT_NAME: ${{ github.event_name }}
        COMPLYSCAN_MARKDOWN_REPORT: ${{ steps.scan.outputs.markdown-report }}
        COMPLYSCAN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [[ "$COMPLYSCAN_EVENT_NAME" == "pull_request" ]]; then
          printf '> Pull-request scope: changed and locally connected code was reviewed against base `%s`. Repository-wide governance checks still used the complete checked-out repository.\n\n' "$COMPLYSCAN_PR_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '**Developer action delta:** %s new, %s reopened, %s resolved; %s active in this evidence bundle.\n\n' '${{ steps.scan.outputs.new-actions }}' '${{ steps.scan.outputs.reopened-actions }}' '${{ steps.scan.outputs.resolved-actions }}' '${{ steps.scan.outputs.active-actions }}' >> "$GITHUB_STEP_SUMMARY"
        fi
        cat "$COMPLYSCAN_MARKDOWN_REPORT" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-results == 'true' && steps.scan.outputs.sarif-ready == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: ${{ inputs.category }}

    - name: Enforce scan completion
      if: ${{ always() && steps.scan.outputs.exit-code != '' }}
      shell: bash
      env:
        COMPLYSCAN_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        if [[ "$COMPLYSCAN_EXIT_CODE" -gt 1 ]]; then
          exit "$COMPLYSCAN_EXIT_CODE"
        fi

    - name: Enforce finding threshold
      if: ${{ always() && inputs.fail-on-findings == 'true' && steps.scan.outputs.exit-code == '1' }}
      shell: bash
      run: exit 1
